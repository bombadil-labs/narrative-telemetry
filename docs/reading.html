<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrative Telemetry — reading</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --p-bn: #4a3aa7; --p-br: #eda100; --p-nr: #e87ba4; }
  @media (prefers-color-scheme: dark) { :root { --p-bn: #9085e9; --p-br: #c98500; --p-nr: #d55181; } }

  /* ---- critical-edition layout ---- */
  .controls { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; align-items: center; margin: 1rem 0 1.6rem;
    font-family: system-ui, sans-serif; font-size: .85rem; }
  .lens { display: flex; gap: .4rem; align-items: center; }
  .lens button { font: inherit; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
    border-radius: 999px; padding: .28rem .8rem; cursor: pointer; display: inline-flex; gap: .4em; align-items: center; }
  .lens button.active { border-color: var(--accent); color: var(--ink); background: color-mix(in oklab, var(--accent) 10%, var(--surface-2)); }
  .modetoggle { display: inline-flex; gap: .45em; align-items: center; cursor: pointer; color: var(--ink-2); }
  .modetoggle input { accent-color: var(--accent); }

  .edition { display: grid; grid-template-columns: minmax(0, 40rem) minmax(14rem, 22rem); gap: 0 2.2rem; }
  @media (max-width: 860px) { .edition { grid-template-columns: 1fr; } .gloss-cell { border-left: none !important; padding-left: 0 !important; margin-bottom: 1.4rem; } }
  .text-cell { font-size: 1.05rem; line-height: 1.72; padding: .45rem .6rem .45rem .8rem; border-radius: 8px; position: relative; }
  .text-cell .pnum { position: absolute; left: -2.4rem; top: .55rem; color: var(--ink-3); font: 10.5px ui-monospace, monospace; user-select: none; }
  @media (max-width: 1020px) { .text-cell .pnum { position: static; display: block; margin-bottom: .1rem; } }
  .heat1 { background: color-mix(in oklab, var(--open) 5%, transparent); }
  .heat2 { background: color-mix(in oklab, var(--open) 10%, transparent); }
  .heat3 { background: color-mix(in oklab, var(--open) 16%, transparent); }
  .gloss-cell { border-left: 1px solid var(--line); padding: .55rem 0 .55rem 1.1rem; }
  .gloss { display: flex; gap: .5rem; align-items: baseline; font-family: system-ui, sans-serif; font-size: .8rem;
    line-height: 1.45; margin-bottom: .55rem; cursor: pointer; opacity: 1; transition: opacity .6s ease, transform .6s ease; }
  .gloss:hover { color: var(--ink); }
  .gloss .dot { flex: none; width: 9px; height: 9px; border-radius: 3px; position: relative; top: 1px; }
  .gloss .who { color: var(--ink-3); }
  .gloss .what { color: var(--ink-2); }
  .gloss b { color: var(--ink); font-weight: 600; }
  .veiled .gloss { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .veiled .text-cell mark.q { background: transparent; border-bottom: none; }
  .veiled .text-cell { background: transparent; }

  mark.q { background: color-mix(in oklab, var(--accent) 13%, transparent); color: inherit; border-bottom: 1.5px solid color-mix(in oklab, var(--accent) 45%, transparent);
    border-radius: 3px; padding: 0 .08em; cursor: pointer; transition: background .5s ease; }
  mark.q:hover { background: color-mix(in oklab, var(--accent) 24%, transparent); }
  u.ent { text-decoration: underline dotted 1.5px var(--ink-3); text-underline-offset: 3px; cursor: pointer; }
  u.ent:hover { text-decoration-color: var(--accent); color: var(--accent); }

  .markbtn { position: absolute; right: .3rem; top: .35rem; border: none; background: none; cursor: pointer;
    color: var(--ink-3); font-size: .95rem; opacity: 0; transition: opacity .15s; padding: .1rem .3rem; }
  .text-cell:hover .markbtn { opacity: .8; }
  .markbtn.here { opacity: 1; color: var(--accent); }
  .bookmark-note { font-family: system-ui, sans-serif; font-size: .78rem; color: var(--accent); margin: .2rem 0 .6rem; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 40; }
  .overlay.open { display: block; }
  .modal { position: fixed; z-index: 41; top: 8vh; left: 50%; transform: translateX(-50%); width: min(680px, 92vw);
    max-height: 80vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 1.3rem 1.5rem; display: none; box-shadow: 0 18px 60px rgba(0,0,0,.3); }
  .modal.open { display: block; }
  .modal h3 { margin: 0 0 .2rem; font-size: 1.15rem; }
  .modal .sub { color: var(--ink-3); font-family: system-ui, sans-serif; font-size: .8rem; margin-bottom: .8rem; }
  .modal .quoteblock { border-left: 3px solid var(--accent); padding: .2rem 0 .2rem .8rem; margin: .7rem 0; color: var(--ink-2); font-style: italic; }
  .modal .claim { display: flex; gap: .55rem; margin: .45rem 0; font-size: .92rem; align-items: baseline; }
  .modal .claim .dot { flex: none; width: 9px; height: 9px; border-radius: 3px; position: relative; top: 1px; }
  .modal .claim .aspect { font-family: system-ui, sans-serif; font-size: .76rem; color: var(--ink-2); white-space: nowrap; }
  .modal .xlink { font-family: system-ui, sans-serif; font-size: .82rem; }
  .modal .close { position: absolute; top: .7rem; right: .9rem; border: none; background: none; color: var(--ink-3);
    font-size: 1.25rem; cursor: pointer; }
  .modal .provline { color: var(--ink-3); font-family: ui-monospace, monospace; font-size: .68rem; margin-top: 1rem; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="site"><h1>loading…</h1></header>
</div>
<div id="tooltip"></div>
<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>
<script>
const READER_KEYS = ["boy", "narrator", "reader"];
const PAIR_META = [
  { key: "boy–narrator", cssVar: "--p-bn" },
  { key: "boy–reader", cssVar: "--p-br" },
  { key: "narrator–reader", cssVar: "--p-nr" },
];
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const slug = new URLSearchParams(location.search).get("text") || "araby";
const BM_KEY = `nt:${slug}:bookmark`;

let D, LENS = "all", READING_MODE = false, REACHED = 0;

fetch(`data/${encodeURIComponent(slug)}.json`).then(r => {
  if (!r.ok) throw new Error(`no data for "${slug}"`);
  return r.json();
}).then(d => { D = prep(d); render(); }).catch(err => {
  document.getElementById("app").innerHTML =
    `<header class="site"><h1>Not found</h1><p class="tag">${esc(err.message)} — <a href="index.html">back to readings</a></p></header>`;
});

// ---- data prep --------------------------------------------------------------------------------
function prep(d) {
  d.label = Object.fromEntries(d.entities.map(e => [e.id, e.label]));
  d.short = (id) => { const l = d.label[id] || id; return l.replace(/\s*\(.*\)$/, ''); };
  d.entityById = Object.fromEntries(d.entities.map(e => [e.id, e]));
  d.occById = Object.fromEntries(d.occurrences.map(o => [o.id, o]));
  d.occByOrd = Object.fromEntries(d.occurrences.map(o => [o.ordinal, o]));
  d.anchorOf = (o) => {
    if (o.quotePara) return o.quotePara;
    const m = /:p(\d+)/.exec(o.source);
    return m ? parseInt(m[1], 10) : 1;
  };
  // claims flattened: {reader, subject, aspect, to, concurs, occurrence}
  d.claims = [];
  for (const r of READER_KEYS)
    for (const [subject, byAspect] of Object.entries(d.tracks[r] || {}))
      for (const [aspect, entries] of Object.entries(byAspect))
        for (const e of entries) d.claims.push({ reader: r, subject, aspect, ...e });
  d.claimsByOcc = {};
  for (const c of d.claims) (d.claimsByOcc[c.occurrence] ??= []).push(c);
  d.claimsByPara = {};
  for (const c of d.claims) {
    const o = d.occById[c.occurrence];
    if (o) (d.claimsByPara[d.anchorOf(o)] ??= []).push(c);
  }
  d.occsByPara = {};
  for (const o of d.occurrences) (d.occsByPara[d.anchorOf(o)] ??= []).push(o);
  d.openSet = new Set(d.ledger.filter(l => l.open).map(l => `${l.subject}|${l.aspect}`));
  // entity → occurrences it participates in; entity → claims targeting it
  d.occsByEntity = {};
  for (const o of d.occurrences) for (const p of o.participants) (d.occsByEntity[p] ??= []).push(o);
  d.claimsByEntity = {};
  for (const c of d.claims) (d.claimsByEntity[c.subject] ??= []).push(c);
  return d;
}

// ---- rendering --------------------------------------------------------------------------------
function render() {
  const d = D;
  document.title = `${d.meta.title} — Narrative Telemetry`;
  REACHED = parseInt(localStorage.getItem(BM_KEY) || "0", 10) || 0;

  document.getElementById("app").innerHTML = `
    <header class="site">
      <p class="tag" style="margin-bottom:.4rem"><a href="index.html">← all readings</a></p>
      <h1>${esc(d.meta.title)}</h1>
      <p class="tag">${esc(d.meta.author)} — ${esc(d.meta.collection)}. ${esc(d.meta.blurb)}</p>
      <div class="controls">
        <span class="lens" id="lens">
          <button data-lens="all" class="active">all readings</button>
          ${READER_KEYS.map(r => `<button data-lens="${r}"><span class="dot ${r}" style="width:9px;height:9px;border-radius:3px;display:inline-block"></span>${esc(d.meta.readers[r])}</button>`).join("")}
        </span>
        <label class="modetoggle"><input type="checkbox" id="modetick">
          reading mode — the readings emerge as you go</label>
      </div>
      ${REACHED > 0 ? `<div class="bookmark-note">⚑ your bookmark is at ¶${REACHED} — reading mode picks up there</div>` : ""}
    </header>

    <div class="edition" id="edition">${d.paragraphs.map((p, i) => paragraphRow(p, i + 1)).join("")}</div>

    <h2>Apparatus</h2>
    <p class="note">The instruments behind the margins: how far apart the readings run, and where
      they end. A falling line is convergence — one reading coming to hold what another holds.</p>
    <figure class="chart" id="chart"></figure>
    <h3>Where the readings end</h3>
    <div style="overflow-x:auto">${ledgerTable(d)}</div>

    <h2>Method, honestly</h2>
    <div class="method">The readings — including their convergence at the story's end — are
      <strong>authored annotations</strong>, not discoveries: an annotator read the story and
      recorded three readers' claims, and convergence is an explicit countersign, never string
      coincidence. What the system contributes is structure: every claim is signed, anchored, and
      content-addressed in a running store; agreement and disagreement are computed from the
      recorded claims; your own reading could be added as a further reader and compared the same
      way. Telemetry here means the measurement of a reading, not the automation of one.</div>

    <footer class="site">
      Exported from running loam stores by
      <a href="https://github.com/bombadil-labs/narrative-telemetry">narrative-telemetry</a>.
      The ground's content address: <span class="mono">${esc(d.meta.groundHex.slice(0, 20))}…</span>,
      byte-identical on every reader's store.</footer>`;

  drawChart(document.getElementById("chart"), d);
  wire();
  applyMode();
}

function paragraphRow(text, n) {
  const d = D;
  const claims = (d.claimsByPara[n] || []);
  const openHere = claims.filter(c => d.openSet.has(`${c.subject}|${c.aspect}`)).length;
  const heat = openHere >= 3 ? "heat3" : openHere === 2 ? "heat2" : openHere === 1 ? "heat1" : "";
  return `
    <div class="text-cell ${heat}" data-para="${n}">
      <span class="pnum">p${String(n).padStart(2, "0")}</span>
      <button class="markbtn" data-mark="${n}" title="mark my place here">⚑</button>
      ${markupParagraph(text, n)}
    </div>
    <div class="gloss-cell" data-para="${n}">
      ${claims.map(c => `
        <div class="gloss" data-reader="${c.reader}" data-occ="${esc(c.occurrence)}">
          <span class="dot ${c.reader}"></span>
          <span><span class="who">${esc(shortReader(c.reader))}:</span>
            <b>${esc(d.short(c.subject))} · ${esc(c.aspect)}</b>
            <span class="what"> — ${esc(c.to)}${c.concurs ? ` (countersigning the ${esc(c.concurs)})` : ""}</span></span>
        </div>`).join("")}
    </div>`;
}

const shortReader = (r) => ({ boy: "the boy", narrator: "the narrator", reader: "the reader" })[r] || r;

// Wrap occurrence quotes (clickable claims-in-the-text) and entity mentions (underlined).
// Segments are computed on the raw text, then escaped per-segment — no DOM surgery.
function markupParagraph(text, n) {
  const d = D;
  const spans = [];
  for (const o of (d.occsByPara[n] || [])) {
    if (!o.quote) continue;
    const idx = text.indexOf(o.quote);
    if (idx >= 0) spans.push({ start: idx, end: idx + o.quote.length, kind: "q", id: o.id });
  }
  spans.sort((a, b) => a.start - b.start || b.end - a.end);
  const kept = [];
  let cursor = 0;
  for (const s of spans) { if (s.start >= cursor) { kept.push(s); cursor = s.end; } }
  let html = "", pos = 0;
  for (const s of kept) {
    html += mentions(text.slice(pos, s.start));
    html += `<mark class="q" data-occ="${esc(s.id)}">${mentions(text.slice(s.start, s.end))}</mark>`;
    pos = s.end;
  }
  html += mentions(text.slice(pos));
  return html;
}

let MENTION_RE = null, MENTION_MAP = null;
function mentions(raw) {
  const d = D;
  if (MENTION_RE === null) {
    MENTION_MAP = {};
    const alts = [];
    for (const e of d.entities) for (const m of (e.mentions || [])) { MENTION_MAP[m] = e.id; alts.push(m); }
    if (alts.length === 0) { MENTION_RE = false; }
    else {
      alts.sort((a, b) => b.length - a.length);
      MENTION_RE = new RegExp(alts.map(a => a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
    }
  }
  if (MENTION_RE === false) return esc(raw);
  let out = "", last = 0;
  for (const m of raw.matchAll(MENTION_RE)) {
    out += esc(raw.slice(last, m.index));
    out += `<u class="ent" data-ent="${esc(MENTION_MAP[m[0]])}">${esc(m[0])}</u>`;
    last = m.index + m[0].length;
  }
  return out + esc(raw.slice(last));
}

// ---- interactivity ----------------------------------------------------------------------------
function wire() {
  const d = D;
  document.getElementById("lens").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-lens]");
    if (!b) return;
    LENS = b.dataset.lens;
    document.querySelectorAll("#lens button").forEach(x => x.classList.toggle("active", x === b));
    applyLens();
  });
  const tick = document.getElementById("modetick");
  tick.addEventListener("change", () => { READING_MODE = tick.checked; applyMode(); });

  document.getElementById("edition").addEventListener("click", (ev) => {
    const mark = ev.target.closest(".markbtn");
    if (mark) { setBookmark(parseInt(mark.dataset.mark, 10)); ev.stopPropagation(); return; }
    // innermost first: an entity underline inside a highlighted quote opens the entity
    const u = ev.target.closest("u.ent[data-ent]");
    if (u) { openEntity(u.dataset.ent); return; }
    const g = ev.target.closest(".gloss[data-occ], mark.q[data-occ]");
    if (g) { openOccurrence(g.dataset.occ); return; }
  });
  document.getElementById("overlay").addEventListener("click", closeModal);
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeModal(); });

  // reading mode: paragraphs become "reached" as they cross the viewport
  const io = new IntersectionObserver((entries) => {
    if (!READING_MODE) return;
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const n = parseInt(e.target.dataset.para, 10);
      if (n <= REACHED + 1) reach(n);
    }
  }, { rootMargin: "0px 0px -45% 0px" });
  document.querySelectorAll(".text-cell").forEach(el => io.observe(el));
}

function applyLens() {
  document.querySelectorAll(".gloss").forEach(g => {
    g.style.display = (LENS === "all" || g.dataset.reader === LENS) ? "" : "none";
  });
}

function applyMode() {
  document.querySelectorAll(".text-cell, .gloss-cell").forEach(el => {
    const n = parseInt(el.dataset.para, 10);
    el.classList.toggle("veiled", READING_MODE && n > REACHED);
  });
  document.querySelectorAll(".markbtn").forEach(b =>
    b.classList.toggle("here", parseInt(b.dataset.mark, 10) === REACHED));
}

function reach(n) {
  if (n > REACHED) { REACHED = n; applyMode(); }
}

function setBookmark(n) {
  REACHED = n;
  localStorage.setItem(BM_KEY, String(n));
  applyMode();
}

// ---- modals -----------------------------------------------------------------------------------
function openModal(html) {
  document.getElementById("modal").innerHTML = `<button class="close" onclick="closeModal()">×</button>` + html;
  document.getElementById("modal").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}
function closeModal() {
  document.getElementById("modal").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}
window.closeModal = closeModal;

function openOccurrence(id) {
  const d = D, o = d.occById[id];
  if (!o) return;
  const claims = d.claimsByOcc[id] || [];
  openModal(`
    <h3>${esc(o.description)}</h3>
    <div class="sub">occurrence ${o.ordinal} of ${d.occurrences.length} · ${esc(o.source.replace(`${d.meta.slug}:`, "¶"))} · part of the ground — the text's own claim, no interpretation</div>
    ${o.quote ? `<div class="quoteblock">“${esc(o.quote)}”</div>` : ""}
    <div class="xlink">involving ${o.participants.map(p =>
      `<u class="ent" data-ent="${esc(p)}" onclick="openEntity('${esc(p)}')">${esc(d.label[p] || p)}</u>`).join(", ")}</div>
    ${claims.length ? `<h3 style="margin-top:1.1rem;font-size:.95rem">How the readers take it</h3>` +
      claims.map(c => `
        <div class="claim"><span class="dot ${c.reader}"></span>
          <span class="aspect">${esc(shortReader(c.reader))} · ${esc(d.short(c.subject))} · ${esc(c.aspect)}</span>
          <span>${esc(c.to)}${c.concurs ? ` <span class="concurs">(countersigning the ${esc(c.concurs)})</span>` : ""}</span>
        </div>`).join("")
      : `<p class="note">No reader has made a claim from this occurrence — it stands unread.</p>`}
    <div class="provline">every claim above is a signed, content-addressed record in that reader's own store</div>`);
}
window.openEntity = openEntity;
function openEntity(id) {
  const d = D, e = d.entityById[id];
  if (!e) return;
  const occs = d.occsByEntity[id] || [];
  const claims = d.claimsByEntity[id] || [];
  openModal(`
    <h3>${esc(e.label)}</h3>
    <div class="sub">${esc(e.kind)} · appears in ${occs.length} occurrence${occs.length === 1 ? "" : "s"} · ${claims.length} claim${claims.length === 1 ? "" : "s"} made about it</div>
    ${claims.length ? `<h3 style="font-size:.95rem">What the readers say</h3>` +
      claims.map(c => {
        const o = d.occById[c.occurrence];
        return `<div class="claim"><span class="dot ${c.reader}"></span>
          <span class="aspect">${esc(shortReader(c.reader))} · ${esc(c.aspect)} · ¶${o ? d.anchorOf(o) : "?"}</span>
          <span>${esc(c.to)}${c.concurs ? ` <span class="concurs">(countersigning the ${esc(c.concurs)})</span>` : ""}</span></div>`;
      }).join("") : `<p class="note">No reader has made a claim about this ${esc(e.kind)} — a telling silence, sometimes.</p>`}
    ${occs.length ? `<h3 style="font-size:.95rem;margin-top:1rem">Where it appears</h3>` +
      occs.map(o => `<div class="claim"><span class="xlink" style="cursor:pointer" onclick="openOccurrenceById('${esc(o.id)}')">¶${d.anchorOf(o)} — ${esc(o.description)}</span></div>`).join("") : ""}`);
}
window.openOccurrenceById = openOccurrence;

// ---- apparatus (chart + ledger) ---------------------------------------------------------------
function ledgerTable(d) {
  const head = `<tr><th>subject · aspect</th>${READER_KEYS.map(r =>
    `<th><span class="chip"><span class="dot ${r}"></span>${esc(d.meta.readers[r])}</span></th>`).join("")}</tr>`;
  const rows = d.ledger.map(row => {
    const cells = READER_KEYS.map(r => {
      const f = row.finals[r];
      return `<td>${f ? esc(f.to) + (f.concurs ? ` <span class="concurs">(countersigning the ${esc(f.concurs)})</span>` : "") : "—"}</td>`;
    }).join("");
    return `<tr><td class="pair">${row.open ? `<span class="badge-open">≠</span> ` : ""}${esc(d.short(row.subject))} · ${esc(row.aspect)}</td>${cells}</tr>`;
  }).join("");
  return `<table class="ledger">${head}${rows}</table>`;
}

function drawChart(fig, d) {
  const curves = PAIR_META.map(p => ({ ...p, values: d.curves[p.key] })).filter(p => p.values);
  const n = Math.max(...curves.map(c => c.values.length));
  const yMax = Math.max(1, ...curves.flatMap(c => c.values));
  const W = 960, H = 240, M = { t: 16, r: 165, b: 30, l: 34 };
  const x = (i) => M.l + (i / (n - 1)) * (W - M.l - M.r);
  const y = (v) => H - M.b - (v / yMax) * (H - M.t - M.b);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Disagreement between reader pairs across ${n} occurrences">`;
  for (let v = 0; v <= yMax; v += Math.max(1, Math.ceil(yMax / 4))) {
    svg += `<line class="gridline" x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}"/>` +
      `<text class="axis-label" x="${M.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  svg += `<text class="axis-label" x="${M.l}" y="${H - 8}">start of the story</text>` +
    `<text class="axis-label" x="${W - M.r}" y="${H - 8}" text-anchor="end">end</text>`;
  const ends = curves.map((c) => ({ c, ly: y(c.values[c.values.length - 1]) })).sort((a, b) => a.ly - b.ly);
  for (let i = 1; i < ends.length; i++)
    if (ends[i].ly - ends[i - 1].ly < 15) ends[i].ly = ends[i - 1].ly + 15;
  const labelY = new Map(ends.map((e) => [e.c.key, e.ly]));
  for (const c of curves) {
    const color = css(c.cssVar);
    const pts = c.values.map((v, i) =>
      `${i ? "L" : "M"}${x(i)},${y(c.values[Math.max(0, i - 1)])} L${x(i)},${y(v)}`).join(" ");
    svg += `<path d="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
    const last = c.values[c.values.length - 1];
    svg += `<circle cx="${x(n - 1)}" cy="${y(last)}" r="3.5" fill="${color}"/>` +
      `<text class="series-label" fill="currentColor" x="${x(n - 1) + 10}" y="${labelY.get(c.key) + 4}">${c.key} (${last})</text>`;
  }
  svg += `<line id="xhair" y1="${M.t}" y2="${H - M.b}" stroke="currentColor" stroke-opacity=".35" stroke-width="1" style="display:none"/>`;
  svg += `<rect id="hover" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/>`;
  svg += `</svg>`;
  fig.innerHTML = svg + `
    <figcaption>How many things each pair of readers currently disagrees about, moment by moment. Direct labels at line ends; hover for detail.</figcaption>
    <details class="tableview"><summary>data table</summary><div style="overflow-x:auto"><table class="ledger">
      <tr><th>occ.</th>${curves.map(c => `<th>${esc(c.key)}</th>`).join("")}</tr>
      ${Array.from({ length: n }, (_, i) =>
        `<tr><td>${i + 1}</td>${curves.map(c => `<td>${c.values[i]}</td>`).join("")}</tr>`).join("")}
    </table></div></details>`;

  const svgEl = fig.querySelector("svg"), hover = fig.querySelector("#hover"),
    xhair = fig.querySelector("#xhair"), tip = document.getElementById("tooltip");
  hover.addEventListener("mousemove", (ev) => {
    const rect = svgEl.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - M.l) / (W - M.l - M.r)) * (n - 1))));
    xhair.style.display = "";
    xhair.setAttribute("x1", x(i)); xhair.setAttribute("x2", x(i));
    const o = d.occByOrd[i + 1];
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 280) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
    tip.innerHTML = `<strong>occurrence ${i + 1}</strong>${o ? ` — ${esc(o.description.slice(0, 90))}${o.description.length > 90 ? "…" : ""}` : ""}<br>` +
      curves.map(c => `${esc(c.key)}: ${c.values[i]}`).join("<br>");
  });
  hover.addEventListener("mouseleave", () => { xhair.style.display = "none"; tip.style.display = "none"; });
}
</script>
</body>
</html>

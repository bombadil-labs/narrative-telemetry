<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrative Telemetry — reading</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --p-bn: #4a3aa7; --p-br: #eda100; --p-nr: #e87ba4; }
  @media (prefers-color-scheme: dark) { :root { --p-bn: #9085e9; --p-br: #c98500; --p-nr: #d55181; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="site"><h1>loading…</h1></header>
</div>
<div id="tooltip"></div>
<script>
const READER_KEYS = ["boy", "narrator", "reader"];
const PAIR_META = [
  { key: "boy–narrator", cssVar: "--p-bn" },
  { key: "boy–reader", cssVar: "--p-br" },
  { key: "narrator–reader", cssVar: "--p-nr" },
];
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const slug = new URLSearchParams(location.search).get("text") || "araby";

fetch(`data/${encodeURIComponent(slug)}.json`).then(r => {
  if (!r.ok) throw new Error(`no data for "${slug}"`);
  return r.json();
}).then(render).catch(err => {
  document.getElementById("app").innerHTML =
    `<header class="site"><h1>Not found</h1><p class="tag">${esc(err.message)} — <a href="index.html">back to readings</a></p></header>`;
});

function render(d) {
  document.title = `${d.meta.title} — Narrative Telemetry`;
  const app = document.getElementById("app");
  const label = Object.fromEntries(d.entities.map(e => [e.id, e.label]));
  const occByOrd = Object.fromEntries(d.occurrences.map(o => [o.ordinal, o]));
  const occById = Object.fromEntries(d.occurrences.map(o => [o.id, o]));
  const firstPara = (src) => parseInt((src.split(":")[1] || "").replace(/^p/, ""), 10) || 1;
  const showSrc = (src) => src.replace(`${d.meta.slug}:`, "¶");

  // ascriptions indexed by occurrence, per reader
  const byOcc = {};
  for (const r of READER_KEYS) {
    for (const [subj, byAspect] of Object.entries(d.tracks[r] || {})) {
      for (const [aspect, entries] of Object.entries(byAspect)) {
        for (const e of entries) {
          ((byOcc[e.occurrence] ??= {})[r] ??= []).push({ subject: subj, aspect, to: e.to, concurs: e.concurs });
        }
      }
    }
  }

  app.innerHTML = `
    <header class="site">
      <p class="tag" style="margin-bottom:.4rem"><a href="index.html">← all readings</a></p>
      <h1>${esc(d.meta.title)}</h1>
      <p class="tag">${esc(d.meta.author)} — ${esc(d.meta.collection)}. ${esc(d.meta.blurb)}</p>
      <p class="tag" style="margin-top:.5rem;font-size:.85rem">One ground of ${d.occurrences.length} occurrences,
        signed by the text's key (ground view <span class="mono">${esc(d.meta.groundHex.slice(0, 18))}…</span>,
        byte-identical on every reader's store), read three ways:</p>
      <div class="legend">
        ${READER_KEYS.map(r => `<span class="chip"><span class="dot ${r}"></span>${esc(d.meta.readers[r])}</span>`).join("")}
      </div>
    </header>

    <h2>Divergence over the telling</h2>
    <p class="note">For each pair of readers: how many shared subject·aspect pairs they currently
      read differently, occurrence by occurrence. A falling line is convergence — one reading has
      come to hold (or explicitly countersign) what the other holds. The boy–narrator collapse at
      the final occurrence is the epiphany, measured.</p>
    <figure class="chart" id="chart"></figure>

    <h2>The divergence ledger</h2>
    <p class="note">End-of-story state per reader. <span class="badge-open">≠</span> marks a
      dispute still open when the story ends.</p>
    <div style="overflow-x:auto">${ledgerTable(d, label)}</div>

    <h2>Ground and readings</h2>
    <p class="note">Left, the story, paragraph-numbered. Right, the ground — what happens, with no
      interpretation — and under each occurrence the readers' signed ascriptions. Click an
      occurrence to light up its paragraph.</p>
    <div class="panes">
      <div class="textpane" id="textpane">
        ${d.paragraphs.map((p, i) =>
          `<p class="para" id="p${i + 1}"><span class="pnum">p${String(i + 1).padStart(2, "0")}</span>${esc(p)}</p>`).join("")}
      </div>
      <div class="timeline">
        ${d.occurrences.map(o => occCard(o, byOcc[o.id], label, d, showSrc)).join("")}
      </div>
    </div>

    <h2>Method, honestly</h2>
    <div class="method">The readings — including the convergence at the epiphany — are
      <strong>authored annotations</strong>, not discoveries: an annotator read the story and
      recorded three readers' claims, and convergence is an explicit <em>concurs</em>
      countersign, never string coincidence. What the system contributes is structure: every claim
      is signed, anchored, and content-addressed in a running store; divergence and convergence
      are computed from the recorded claims; rival annotations can be added as further readers and
      diffed the same way. Telemetry here means the measurement of a reading, not the automation
      of one.</div>

    <footer class="site">
      Exported from running loam stores by the
      <a href="https://github.com/bombadil-labs/narrative-telemetry">narrative-telemetry</a>
      pipeline. ${esc(d.meta.generated)}</footer>`;

  drawChart(document.getElementById("chart"), d, occByOrd);

  // occurrence → paragraph linking
  let lit = null;
  document.querySelectorAll(".occ .head").forEach(head => {
    head.addEventListener("click", () => {
      const p = document.getElementById(`p${head.dataset.para}`);
      if (!p) return;
      if (lit) lit.classList.remove("hl");
      p.classList.add("hl");
      lit = p;
      p.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });

  function occCard(o, asc, label, d, showSrc) {
    const parts = o.participants.map(p => label[p] || p).join(", ");
    const claims = asc
      ? READER_KEYS.flatMap(r => (asc[r] || []).map(c => `
          <div class="claim"><span class="dot ${r}"></span>
            <span class="aspect">${esc(label[c.subject] || c.subject)} · ${esc(c.aspect)}</span>
            <span>${esc(c.to)}${c.concurs ? ` <span class="concurs">(countersigns the ${esc(c.concurs)})</span>` : ""}</span>
          </div>`))
      : [];
    return `
      <div class="occ">
        <div class="head" data-para="${firstPara(o.source)}" title="show paragraph">
          <span class="ord">${o.ordinal}</span>
          <span class="src">${esc(showSrc(o.source))}</span>
          <span class="desc">${esc(o.description)}</span>
        </div>
        <div class="participants">${esc(parts)}</div>
        ${claims.length ? `<div class="asc">${claims.join("")}</div>` : ""}
      </div>`;
  }
}

function ledgerTable(d, label) {
  const head = `<tr><th>subject · aspect</th>${READER_KEYS.map(r =>
    `<th><span class="chip"><span class="dot ${r}"></span>${esc(d.meta.readers[r])}</span></th>`).join("")}</tr>`;
  const rows = d.ledger.map(row => {
    const cells = READER_KEYS.map(r => {
      const f = row.finals[r];
      return `<td>${f ? esc(f.to) + (f.concurs ? ` <span class="concurs">(countersigns the ${esc(f.concurs)})</span>` : "") : "—"}</td>`;
    }).join("");
    return `<tr><td class="pair">${row.open ? `<span class="badge-open">≠</span> ` : ""}${esc(label[row.subject] || row.subject)} · ${esc(row.aspect)}</td>${cells}</tr>`;
  }).join("");
  return `<table class="ledger">${head}${rows}</table>`;
}

function drawChart(fig, d, occByOrd) {
  const curves = PAIR_META.map(p => ({ ...p, values: d.curves[p.key] })).filter(p => p.values);
  const n = Math.max(...curves.map(c => c.values.length));
  const yMax = Math.max(1, ...curves.flatMap(c => c.values));
  const W = 960, H = 260, M = { t: 16, r: 150, b: 30, l: 34 };
  const x = (i) => M.l + (i / (n - 1)) * (W - M.l - M.r);
  const y = (v) => H - M.b - (v / yMax) * (H - M.t - M.b);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Divergence between reader pairs across ${n} occurrences">`;
  for (let v = 0; v <= yMax; v += Math.max(1, Math.ceil(yMax / 4))) {
    svg += `<line class="gridline" x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}"/>` +
      `<text class="axis-label" x="${M.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  svg += `<text class="axis-label" x="${M.l}" y="${H - 8}">occurrence 1</text>` +
    `<text class="axis-label" x="${W - M.r}" y="${H - 8}" text-anchor="end">${n}</text>`;
  // de-overlap end labels: sort by end y, push apart to >=15px separation
  const ends = curves.map((c) => ({ c, ly: y(c.values[c.values.length - 1]) }))
    .sort((a, b) => a.ly - b.ly);
  for (let i = 1; i < ends.length; i++)
    if (ends[i].ly - ends[i - 1].ly < 15) ends[i].ly = ends[i - 1].ly + 15;
  const labelY = new Map(ends.map((e) => [e.c.key, e.ly]));
  for (const c of curves) {
    const color = css(c.cssVar);
    const pts = c.values.map((v, i) =>
      `${i ? "L" : "M"}${x(i)},${y(c.values[Math.max(0, i - 1)])} L${x(i)},${y(v)}`).join(" ");
    svg += `<path d="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
    const last = c.values[c.values.length - 1];
    svg += `<circle cx="${x(n - 1)}" cy="${y(last)}" r="3.5" fill="${color}"/>` +
      `<text class="series-label" fill="currentColor" x="${x(n - 1) + 10}" y="${labelY.get(c.key) + 4}">${c.key} (${last})</text>`;
  }
  svg += `<line id="xhair" y1="${M.t}" y2="${H - M.b}" stroke="currentColor" stroke-opacity=".35" stroke-width="1" style="display:none"/>`;
  svg += `<rect id="hover" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/>`;
  svg += `</svg>`;
  fig.innerHTML = svg + `
    <figcaption>Open disputes between each reader pair, per occurrence. Direct labels at line ends; hover for detail.</figcaption>
    <details class="tableview"><summary>data table</summary><div style="overflow-x:auto"><table class="ledger">
      <tr><th>occ.</th>${curves.map(c => `<th>${esc(c.key)}</th>`).join("")}</tr>
      ${Array.from({ length: n }, (_, i) =>
        `<tr><td>${i + 1}</td>${curves.map(c => `<td>${c.values[i]}</td>`).join("")}</tr>`).join("")}
    </table></div></details>`;

  const svgEl = fig.querySelector("svg"), hover = fig.querySelector("#hover"),
    xhair = fig.querySelector("#xhair"), tip = document.getElementById("tooltip");
  hover.addEventListener("mousemove", (ev) => {
    const rect = svgEl.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - M.l) / (W - M.l - M.r)) * (n - 1))));
    xhair.style.display = "";
    xhair.setAttribute("x1", x(i)); xhair.setAttribute("x2", x(i));
    const o = occByOrd[i + 1];
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 280) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
    tip.innerHTML = `<strong>occurrence ${i + 1}</strong>${o ? ` — ${esc(o.description.slice(0, 90))}${o.description.length > 90 ? "…" : ""}` : ""}<br>` +
      curves.map(c => `${esc(c.key)}: ${c.values[i]}`).join("<br>");
  });
  hover.addEventListener("mouseleave", () => { xhair.style.display = "none"; tip.style.display = "none"; });
}
</script>
</body>
</html>

name: Deploy site to GitHub Pages

# Publishes docs/ to the gh-pages branch. The artifact-based flow (configure-pages with
# enablement:true) failed here — the workflow token may not create the Pages site in this
# org ("Resource not accessible by integration") — so we use the branch flow, which GitHub
# auto-enables Pages for. If the site does not appear after the first green run:
# Settings → Pages → Deploy from a branch → gh-pages / root, once.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
